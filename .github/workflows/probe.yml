name: Probe

# Calls public, read-only Polymarket endpoints from a GitHub runner and keeps the responses, for
# test fixtures and to see which hosts answer. Sends no credentials and changes nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --no-default-groups
      - run: uv run --no-sync python scripts/probe.py probe-output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-output
          path: probe-output/
